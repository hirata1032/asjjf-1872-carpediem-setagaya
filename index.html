const find=(c,n)=>ROWS.find(r=>r.cat===c&&r.no===n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const catJ=c=>c.replace("Male ","男子 ").replace("White","白帯").replace("Blue","青帯").replace("Purple","紫帯").replace("Master","マスター").replace("Adult","アダルト").replace("Open Weight","オープン");
const rdJ=r=>({R1:"1回戦",R2:"2回戦",SF:"準決勝",F:"決勝"}[r]||r);

const EV=[];

 f.sc.forEach(n=>{const r=find(f.cat,n);if(r)EV.push({type:"sc",f,r,est:""});});
});

 const day=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
 if(day<20261012)return -1; if(day>20261012)return 99999; return d.getHours()*60+d.getMinutes();}

function stateCls(e,now,nextT){return e.t+8<=now?"past":(e.t===nextT?"nx":"")}

 document.getElementById("tlist").innerHTML=own.map(e=>item(e,stateCls(e,now,nxO&&nxO.t))).join("");

 return `<details ${ownC&&rs[0].day==DAY?"open":""}><summary>${ownC?"★ ":""}${esc(catJ(c))}（${rs[0].day}日・${rs.length}試合）<span style="display:inline-block;margin-left:6px;padding:1px 8px;border-radius:10px;background:#c62828;color:#fff;font-size:.85em">👤 ${esc([...FIGHTERS,...D11].filter(f=>f.cat===c).map(f=>f.jp).join("・"))}</span></summary><table><tr><th>#</th><th>回戦</th><th>時間</th><th>マット</th><th>対戦</th></tr>
 ${rs.map(r=>`<tr class="${(r.a+r.b).includes("Carpe Diem Setagaya")?"ownrow":""}"><td>${r.no}</td><td>${rdJ(r.rd)}</td><td>${r.day}日 ${r.time}</td><td>${r.mat}</td><td>${hl(r.a)}<br>vs ${hl(r.b)}</td></tr>`).join("")}</table></details>`}).join("")
 +'<p class="c" style="font-size:12px;color:#6b7280">TBD＝前の試合の勝者（未確定）。★＝Carpe Diem Setagaya出場カテゴリー。</p>';
document.getElementById("d1").innerHTML=`<div class="card"><h3>10/11（日）の結果</h3>${D11.map(d=>{const r=find(d.cat,d.no);return `<h4>${esc(d.jp)}・${esc(catJ(d.cat))}</h4><div class="m past" style="opacity:.8">${matB(r.mat)}<div class="tm">${r.time}</div><div class="info"><div class="c">#${r.no} ${rdJ(r.rd)} <span class="tag t-done">1回戦敗退</span></div><div class="v">${hl(r.a)}<br>vs ${hl(r.b)}</div></div></div>`}).join("")}</div>`;
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button,section").forEach(x=>x.classList.remove("on"));b.classList.add("on");document.getElementById(b.dataset.s).classList.add("on");scrollTo(0,0)});
function tick(){document.getElementById("clock").textContent=new Date().toLocaleTimeString("ja-JP",{timeZone:"Asia/Tokyo",hour:"2-digit",minute:"2-digit",second:"2-digit"})}
let lastM=-2;setInterval(()=>{tick();const n=nowMin();if(n!==lastM){lastM=n;render()}},1000);tick();render();
